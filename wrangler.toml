name = "post-meeting-action-assistant"
main = "worker.js"
compatibility_date = "2026-09-01"

# Only ./public is uploaded. .env lives at the project root and therefore
# cannot be published by accident.
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
LLM_MODEL = "deepseek-v4.1-flash"

# OPENCODE_API_KEY is a secret, never a var and never in this file:
#   npx wrangler secret put OPENCODE_API_KEY
